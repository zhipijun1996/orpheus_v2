state_id: STORY_CONTRACT
status: provisional
scope: project
applies_to: ordinary_routes

shared_story_anchor:
  artifact_id: SCENE_CH2
  scene_id: CH2_0317_COMMON
  statement: 所有普通Route解释同一组当前Shared观测；Route可给出互斥真相，强创意若需要改变共享观测则提交Shared Scene Delta。

chapter_architecture:
  ch2:
    time_anchor: '2036-03:17'
    role: shared_mystery_experience
    requirement: 玩家第一次经历共同谜面；Route从同一组可观察事件出发。
  ch4:
    time_anchor: '2054'
    role: working_truth
    requirement: 从2054人物调查或行动出发，对03:17核心谜面形成可信、可行动的Working Truth。
  ch5:
    time_anchor: 2036_CAUSAL_LAYER
    role: deep_truth
    requirement: 进入、亲历或高强度重建03:17真实因果层，并完成本Route要求关闭的核心谜题。

truth_layers:
  story_engine: 回答“为什么这些人物必须做这些事”。
  route_truth: 回答“这条Route里03:17实际上为何如此发生”。
  evidence: 回答“玩家凭什么知道”。
  rule: Evidence可承载Truth，但取证方法、日志恢复或记录缺口本身不能替代Story Engine或Deep Truth。

core_route_mysteries:
  accident_causality:
    route_engagement: REQUIRED
    route_resolution: LOCAL_COMMITMENT_REQUIRED
    exposure: BY_CH5
    required_answers: [cause_chain, decisive_human_actions, causal_impact]
  null_mystery:
    route_engagement: REQUIRED
    route_resolution: LOCAL_COMMITMENT_REQUIRED
    exposure: BY_CH5
    required_answers: [ontology, agency, actions, motive, objective, causal_impact, apparent_contradiction]
    identity_only_resolution: insufficient
  zhou_0317_role:
    route_engagement: REQUIRED
    route_resolution: FUNCTION_REQUIRED
    exposure: BY_CH5
    required_answers: [goal, decisive_actions, causal_effect]
  lin_0317_role:
    route_engagement: REQUIRED
    route_resolution: FUNCTION_REQUIRED
    exposure: BY_CH5
    required_answers: [goal, decisive_actions, causal_effect, route_meaning_of_injury_or_disappearance]

route_engine_fusion:
  principle: 核心人物关系、Route定义性科幻/因果前提、Shared核心谜题应彼此产生因果，而非并列包装。
  diagnostics:
  - 删除核心人物关系后，关键科幻行动是否仍会基本原样发生。
  - 删除Route定义性科幻/因果前提后，人物主冲突是否仍能基本原样成立。
  - 将03:17替换成普通无关事故后，Route主因果与结局是否仍基本成立。
  - Deep Truth改变的是事故因果与人物行为意义，还是仅改变取证方式。
  verdicts:
    STRONG: 三层相互依赖，抽掉任一层都会实质改变主故事。
    PARTIAL: 存在真实连接，但至少一层仍主要是载体；作为风险继续开发，不自动淘汰。
    DETACHED: 主人物故事、科幻前提或Shared核心谜题可大面积互换；FAIL或ROLLBACK_PARENT。

route_engine_requirements:
- Route必须解释当前SCENE_CH2的fixed_observations；若需要改变共享观测，提交Shared Scene Delta并保持Route本体不私改Shared。
- 2054人物欲望必须最终因果连接回03:17。
- Working Truth与Deep Truth回答Shared事故提出的核心问题，而非只解释Route新造谜题。
- Ch5必须给程砚、林岚、周启明各自一个不可忽略的事故因果功能；不要求每条Route关闭其全部更远结局。
- Route-local机制服务人物行动与既有谜面的重新理解。

mechanism_discipline:
  principle: 鼓励能生成剧情、人物困境、反转或既有谜面新解释的高杠杆机制；不因“新”或数量本身惩罚创意，重点审查解释性脚手架和补丁链。
  explore: EXPLORE阶段允许大胆提出新机制，不以机制数量预先淘汰候选。
  classes:
    ENGINE: 直接创造新行动可能、人物冲突、核心反转或多处既有观测解释力。
    SUPPORT: 让ENGINE可操作所必需的边界、限制或代价。
    PATCH: 主要解释上一个机制造成的漏洞、例外或记录缺口；属于复杂度债务。
  leverage_test:
  - 新机制是否同时服务剧情行动、人物选择、谜题解释或场景价值中的多个维度。
  - 更简单已有规则可完成同样功能时优先复用。
  - 连续新增机制只为解释前一机制为何不出错时，优先回滚并简化父机制。
  terminology:
    rule: 先用普通语言解释现象与规则；只有反复使用、影响玩家判断且命名提高精度时才引入专有术语。
  foreshadow:
    rule: Ch4/Ch5关键反转依赖的机制性质可以晚命名、晚解释，但揭示前必须有可回看的可观察痕迹。
  synthesis_preference: 同等故事质量下，优先叙事杠杆更高、PATCH依赖更浅的方案，而非机械选择机制更少。

comprehensibility_test:
  rule: 删除Route-local技术名词后，仍能用2至3句话说明“谁想要什么、03:17为何成为障碍、这条Route最终如何改变对03:17的理解”。

failure_classification:
  detached_route_engine: Route Engine Fusion判为DETACHED。
  core_mystery_evasion: BY_CH5仍未完成REQUIRED核心谜题，或只用身份揭晓/取证手段冒充因果答案。
  core_cast_dropout: Ch5因果层中任一核心人物可删除且几乎不影响本Route事故真相。
  patch_chain: 连续新增规则主要用于修补前一机制漏洞而非创造新故事可能。
