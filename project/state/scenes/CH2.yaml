scene_id: CH2_0317_COMMON
status: candidate
function: 所有普通Route共同解释的2036·03:17共享观测底盘。

shared_rule: 只有fixed_observations列出的内容属于Shared事实；未列出的事故细节、身份、机制、动机与因果均为未定义。

fixed_observations:
- 事故前，程砚、林岚、周启明共同参与面向过去的信息实验。
- 2036·03:17发生重大实验事故，程砚在现场并幸存。
- 事故过程中出现被称为NULL的黑色人物表象。
- 程砚试图继续进入危险区域或实施救援时，NULL的行动阻断了他。
- NULL随后又做出使程砚离开直接危险位置的动作。
- 林岚在事故末段主动试图完成某项操作。
- NULL开枪击伤林岚左肩或左上臂区域。
- 林岚随后在事故峰值中失去程砚的连续确认。

route_obligations:
- 到Ch5解释03:17为何最终演变成重大事故。
- 解释NULL在本Route中的关键行为、动机与因果作用。
- 解释周启明在03:17中的关键目标、行动与因果作用。
- 解释林岚当时的目标，以及枪伤与消失在本Route中的意义。

shared_delta: 强Route若需要新增或微调Ch2观测，应提出最小Shared Scene Delta；Route本体不得自行改写共享场景。
