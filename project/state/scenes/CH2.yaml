scene_id: CH2_0317_COMMON
status: candidate
function: 作为多个普通Route共享的03:17事故/犯罪现场观测层；提供高价值现象，但推迟Route级机制解释。
character_knowledge:
  knows:
  - 奥菲斯实验目标包含向过去发送信息。
  - 现场正在发生严重实验/系统失控。
  does_not_know:
  - 未来是否成功发展出成熟阿尔戈。
  - 是否存在未来访客。
  - NULL的真实身份和Route级来源。
current_observations:
- 程砚、林岚、周启明都在03:17事故链中。
- 年轻程砚在最后阶段直接确认周启明仍在核心（当前候选Shared锚点）。
- 事故中出现黑色应急人物/NULL标签表象。
- NULL相关行为在表面上存在互相矛盾或难以理解之处。
- 林岚遭受肩部相关伤害并从年轻程砚之后的正常生活中消失。
- 03:17事故确实发生。
- 事故后证据不足以唯一重建所有人物最后区间。
preserve_open:
- NULL是否一人
- NULL是否来自未来
- 未来程砚是否以独立身体存在
- 未来人格是否进入宿主
- 周启明最后关键区间
- 林岚消失/2054出现机制
- 任何一个异常的唯一因果解释
route_hooks:
  FLESH: 允许黑衣人物在本Route被解释为真实未来肉身。
  ECHO: 允许同一Shared表象在本Route被解释为宿主/人格机制。
  ORIGIN: 当前保留最大自由，不给养女预分配2036动作。
  BLINDSPOT: 保留关键最后区间与少量来源未知异常。
  NOBODY: 所有Shared观测必须仍可由2036本地人物/系统解释。
open_design_questions:
- 共享NULL应出现几次、哪些动作必须跨Route保留。
- 肩部动作究竟应固定到什么可观察粒度。
- 如何让周启明最后区间既有戏剧强度又不被Shared层过度记录。
- 事故对外调查结论与实验室后续处置需要重新统一。
